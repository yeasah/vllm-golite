[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-untwisted"
version = "0.0.1"
description = "vLLM engine management for a single-box inference appliance"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
untwisted = "vllm_untwisted.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["vllm_untwisted"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
